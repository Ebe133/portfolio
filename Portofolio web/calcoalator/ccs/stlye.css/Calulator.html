<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <link rel="stylesheet" href="ccs/stlye.css/style.css">
</head>

<body>
  <div class="calculator-container">
    
    <div class="calculator"> 
      
      <input type="text" id="display" placeholder="Answer" disabled>
      <table>
        <tr>
          <td><button class="btn" id="ac" onclick="clearDisplay()">AC</button></td>
          <td><button class="btn" onclick="changeSign()">+/-</button></td>
          <td><button class="btn" onclick="appendToDisplay('%')">%</button></td>
          <td><button class="btn" onclick="appendToDisplay('/')">÷</button></td>
        </tr>
        <tr>
          <td><button onclick="appendToDisplay('7')">7</button></td>
          <td><button onclick="appendToDisplay('8')">8</button></td>
          <td><button onclick="appendToDisplay('9')">9</button></td>
          <td><button class="btn" onclick="appendToDisplay('*')">X</button></td>
        </tr>
        <tr>
          <td><button onclick="appendToDisplay('4')">4</button></td>
          <td><button onclick="appendToDisplay('5')">5</button></td>
          <td><button onclick="appendToDisplay('6')">6</button></td>
          <td><button class="btn" onclick="appendToDisplay('-')">-</button></td>
        </tr>
        <tr>
          <td><button onclick="appendToDisplay('1')">1</button></td>
          <td><button onclick="appendToDisplay('2')">2</button></td>
          <td><button onclick="appendToDisplay('3')">3</button></td>
          <td><button class="btn" onclick="appendToDisplay('+')">+</button></td>
        </tr>
        <tr>
          <td colspan="2"><button class="zero" onclick="appendToDisplay('0')">0</button></td>
          <td><button class="btn" onclick="appendToDisplay('.')">,</button></td>
          <td><button class="btn" onclick="calculateResult()">=</button></td>
        </tr>
      </table>
    </div>
  </div>    
  <script src="js/script.js"></script>
</body>
</html>
